<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serene // Life Control Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10121a;
    --bg-elev: #171a24;
    --card: #1b1f2b;
    --card-border: #2a2f3f;
    --ink: #e9e8ef;
    --ink-dim: #a4a7b8;
    --ink-faint: #6b6e80;
    --gold: #cba35c;
    --gold-soft: rgba(203,163,92,0.14);
    --teal: #6fc7b8;
    --teal-soft: rgba(111,199,184,0.14);
    --rose: #d98a8a;
    --rose-soft: rgba(217,138,138,0.14);
    --track: #262b3a;
    --radius: 14px;
    --radius-sm: 10px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(circle at 15% -10%, rgba(203,163,92,0.08), transparent 45%),
      radial-gradient(circle at 100% 10%, rgba(111,199,184,0.06), transparent 40%),
      var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    min-height: 100vh;
    padding: 28px 16px 60px;
  }

  .wrap{ max-width: 880px; margin: 0 auto; }

  /* Header */
  header{ margin-bottom: 26px; }
  .brand{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.02em;
    display:flex; align-items:center; gap:10px;
  }
  .brand .dot{ width:8px; height:8px; border-radius:50%; background:var(--gold); box-shadow:0 0 10px var(--gold); }
  .tagline{ color: var(--ink-faint); font-size: 12.5px; margin-top:4px; letter-spacing:0.04em; text-transform:uppercase; font-family: var(--font-mono); }

  nav.tabs{ display:flex; gap:6px; margin-top:20px; }
  nav.tabs button{
    background:transparent; border:1px solid var(--card-border); color:var(--ink-dim);
    padding:7px 14px; border-radius: 999px; font-family: var(--font-body); font-size:13px; font-weight:600;
    cursor:pointer; transition: all .15s ease;
  }
  nav.tabs button.active{ background: var(--gold-soft); color: var(--gold); border-color: rgba(203,163,92,0.4); }
  nav.tabs button:hover:not(.active){ color: var(--ink); border-color:#3a3f52; }

  section.view{ display:none; }
  section.view.active{ display:block; }

  /* Card base */
  .card{
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px; }
  .card-title{ font-family: var(--font-display); font-weight:600; font-size:15px; letter-spacing:0.01em; display:flex; align-items:center; gap:8px; }
  .card-title .icon{ opacity:0.85; }
  .edit-btn{
    background:none; border:none; color:var(--ink-faint); cursor:pointer; padding:4px; border-radius:6px;
    display:flex; align-items:center; justify-content:center; transition: color .15s;
  }
  .edit-btn:hover{ color: var(--gold); }

  /* Goal / IDA card */
  .goal-row{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; }
  .goal-label{ font-family: var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color: var(--ink-faint); }
  .goal-numbers{ display:flex; align-items:baseline; gap:6px; font-family: var(--font-display); }
  .goal-current{ font-size: 30px; font-weight:700; color: var(--gold); }
  .goal-slash{ color: var(--ink-faint); font-size:16px; }
  .goal-target{ font-size:16px; color: var(--ink-dim); font-weight:600; }
  .goal-pct{ font-family: var(--font-mono); font-size:13px; color: var(--teal); font-weight:600; }

  .bar-track{
    height: 10px; background: var(--track); border-radius: 999px; overflow:hidden; position:relative;
    margin: 6px 0 2px;
  }
  .bar-fill{
    height:100%; border-radius:999px;
    background: linear-gradient(90deg, #a9803f, var(--gold));
    box-shadow: 0 0 12px rgba(203,163,92,0.45);
    transition: width .5s cubic-bezier(.2,.8,.2,1);
    position: relative;
  }
  .bar-fill.thin{ box-shadow:none; }
  .bar-fill::after{
    content:''; position:absolute; top:0; right:0; bottom:0; width:14px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25));
  }

  .edit-row{ display:flex; gap:10px; margin-top: 10px; flex-wrap:wrap; }
  .edit-field{ display:flex; flex-direction:column; gap:4px; }
  .edit-field label{ font-size:11px; color:var(--ink-faint); font-family: var(--font-mono); }
  .edit-field input{
    background: var(--bg-elev); border:1px solid var(--card-border); color:var(--ink);
    border-radius:8px; padding:7px 10px; font-family: var(--font-mono); font-size:14px; width:120px;
  }
  .edit-field input:focus{ outline:none; border-color: var(--gold); }
  .save-btn{
    background: var(--gold-soft); color: var(--gold); border:1px solid rgba(203,163,92,0.4);
    border-radius:8px; padding:7px 14px; font-weight:600; font-size:13px; cursor:pointer; font-family: var(--font-body);
    align-self:flex-end;
  }
  .save-btn:hover{ background: rgba(203,163,92,0.24); }

  /* Quests */
  .quest{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--card-border); }
  .quest:last-child{ border-bottom:none; }
  .quest-tag{
    font-family: var(--font-mono); font-size:10px; color: var(--ink-faint); width:64px; flex-shrink:0;
    text-transform:uppercase; letter-spacing:0.06em;
  }
  .quest.main .quest-tag{ color: var(--gold); }
  .quest-check{
    width:20px; height:20px; border-radius:6px; border:1.5px solid var(--card-border);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
    transition: all .15s ease;
  }
  .quest-check.done{ background: var(--gold); border-color: var(--gold); }
  .quest-check svg{ display:none; width:12px; height:12px; }
  .quest-check.done svg{ display:block; }
  .quest-input{
    flex:1; background:transparent; border:none; color:var(--ink); font-family: var(--font-body); font-size:14px;
    padding:4px 0;
  }
  .quest-input:focus{ outline:none; }
  .quest-input::placeholder{ color: var(--ink-faint); }
  .quest.done .quest-input{ color: var(--ink-faint); text-decoration: line-through; }

  /* Dailies */
  .daily-header-row{ display:flex; align-items:center; justify-content:space-between; }
  .daily-count{ font-family: var(--font-mono); font-size:13px; color: var(--teal); font-weight:600; }
  .daily-item{ display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--card-border); }
  .daily-item:last-child{ border-bottom:none; }
  .daily-check{
    width:19px; height:19px; border-radius:5px; border:1.5px solid var(--card-border);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
    transition: all .15s ease;
  }
  .daily-check.done{ background: var(--teal); border-color: var(--teal); }
  .daily-check svg{ display:none; width:11px; height:11px; }
  .daily-check.done svg{ display:block; }
  .daily-text{ font-size:14px; color: var(--ink-dim); cursor:pointer; user-select:none; }
  .daily-item.done .daily-text{ color: var(--ink-faint); text-decoration: line-through; }

  /* Weekly stats grid */
  .stat-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  @media (min-width: 620px){ .stat-grid{ grid-template-columns: 1fr 1fr 1fr; } }
  .stat-card{ background: var(--bg-elev); border:1px solid var(--card-border); border-radius: var(--radius-sm); padding:13px; }
  .stat-name{ font-size:11.5px; color: var(--ink-faint); font-family: var(--font-mono); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px; }
  .stat-nums{ display:flex; align-items:baseline; gap:4px; margin-bottom:8px; }
  .stat-current{ font-family: var(--font-display); font-size:19px; font-weight:700; }
  .stat-target{ font-size:13px; color: var(--ink-faint); font-family: var(--font-mono); }
  .stat-controls{ display:flex; align-items:center; gap:8px; margin-top:6px; }
  .stepper{
    width:22px; height:22px; border-radius:6px; border:1px solid var(--card-border); background:var(--card);
    color: var(--ink-dim); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px;
  }
  .stepper:hover{ border-color: var(--gold); color: var(--gold); }

  /* Energy */
  .energy-row{ display:flex; gap:10px; }
  .energy-btn{
    flex:1; padding:14px 8px; border-radius: var(--radius-sm); border:1px solid var(--card-border);
    background: var(--bg-elev); color: var(--ink-dim); font-family: var(--font-body); font-weight:600; font-size:13px;
    cursor:pointer; transition: all .15s ease; text-align:center;
  }
  .energy-btn .em{ display:block; font-size:20px; margin-bottom:4px; }
  .energy-btn.sel-low{ background: var(--rose-soft); border-color: rgba(217,138,138,0.5); color:#e8b1b1; }
  .energy-btn.sel-okay{ background: var(--gold-soft); border-color: rgba(203,163,92,0.5); color: var(--gold); }
  .energy-btn.sel-good{ background: var(--teal-soft); border-color: rgba(111,199,184,0.5); color: var(--teal); }

  /* Footer / data controls */
  .data-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .ghost-btn{
    background: var(--bg-elev); border:1px solid var(--card-border); color: var(--ink-dim);
    padding:9px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; font-family: var(--font-body);
    display:flex; align-items:center; gap:7px;
  }
  .ghost-btn:hover{ border-color:#3a3f52; color: var(--ink); }
  input[type=file]{ display:none; }

  /* History */
  .hist-section{ margin-bottom: 22px; }
  .hist-title{ font-family: var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color: var(--ink-faint); margin-bottom:10px; }
  .hist-table{ width:100%; border-collapse: collapse; font-size:13px; }
  .hist-table th{ text-align:left; color: var(--ink-faint); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; padding:8px 10px; border-bottom:1px solid var(--card-border); }
  .hist-table td{ padding:10px 10px; border-bottom:1px solid var(--card-border); color: var(--ink-dim); }
  .hist-table tr:last-child td{ border-bottom:none; }
  .pill{ display:inline-block; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:600; font-family: var(--font-mono); }
  .pill.low{ background: var(--rose-soft); color:#e8b1b1; }
  .pill.okay{ background: var(--gold-soft); color: var(--gold); }
  .pill.good{ background: var(--teal-soft); color: var(--teal); }
  .empty-note{ color: var(--ink-faint); font-size:13px; padding:14px 4px; }

  .toast{
    position: fixed; bottom: 22px; left:50%; transform: translateX(-50%) translateY(10px);
    background: var(--card); border:1px solid var(--gold); color: var(--ink); padding:10px 18px;
    border-radius: 999px; font-size:13px; font-weight:600; opacity:0; pointer-events:none;
    transition: all .25s ease; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  ::selection{ background: var(--gold-soft); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand"><span class="dot"></span>SERENE // LIFE CONTROL PANEL</div>
    <div class="tagline" id="todayLabel">—</div>
    <nav class="tabs">
      <button class="active" data-view="dashboard">Dashboard</button>
      <button data-view="history">History</button>
    </nav>
  </header>

  <!-- ============ DASHBOARD ============ -->
  <section class="view active" id="view-dashboard">

    <!-- IDA Progress -->
    <div class="card">
      <div class="card-head">
        <div class="card-title"><span class="icon">◆</span>2026 Goal: Clear IDA</div>
        <button class="edit-btn" id="goalEditToggle" title="Edit">✎</button>
      </div>
      <div class="goal-row">
        <div class="goal-label">FYCC Progress</div>
        <div class="goal-pct" id="goalPct">0%</div>
      </div>
      <div class="goal-numbers">
        <span class="goal-current" id="goalCurrent">$0</span>
        <span class="goal-slash">/</span>
        <span class="goal-target" id="goalTarget">$0</span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="goalBar" style="width:0%"></div></div>
      <div class="edit-row" id="goalEditRow" style="display:none;">
        <div class="edit-field">
          <label>Current FYCC</label>
          <input type="number" id="goalCurrentInput" min="0">
        </div>
        <div class="edit-field">
          <label>Target FYCC</label>
          <input type="number" id="goalTargetInput" min="0">
        </div>
        <button class="save-btn" id="goalSaveBtn">Save</button>
      </div>
    </div>

    <!-- Today's 3 Quests -->
    <div class="card">
      <div class="card-head">
        <div class="card-title"><span class="icon">⚔</span>Today's 3 Quests</div>
      </div>
      <div id="questsList"></div>
    </div>

    <!-- Work Dailies -->
    <div class="card">
      <div class="card-head daily-header-row">
        <div class="card-title"><span class="icon">▸</span>Work Dailies</div>
        <div class="daily-count" id="dailyCount">0 / 8</div>
      </div>
      <div class="bar-track" style="margin-bottom:12px;"><div class="bar-fill thin" id="dailyBar" style="width:0%; background: var(--teal); box-shadow:none;"></div></div>
      <div id="dailyList"></div>
    </div>

    <!-- Weekly Stats -->
    <div class="card">
      <div class="card-head">
        <div class="card-title"><span class="icon">◈</span>Weekly Stats</div>
        <button class="edit-btn" id="weekEditToggle" title="Edit targets">✎</button>
      </div>
      <div class="stat-grid" id="statGrid"></div>
    </div>

    <!-- Energy -->
    <div class="card">
      <div class="card-head">
        <div class="card-title"><span class="icon">☼</span>Daily Energy</div>
      </div>
      <div class="energy-row" id="energyRow">
        <button class="energy-btn" data-energy="low"><span class="em">▽</span>Low</button>
        <button class="energy-btn" data-energy="okay"><span class="em">◐</span>Okay</button>
        <button class="energy-btn" data-energy="good"><span class="em">△</span>Good</button>
      </div>
    </div>

    <!-- Data -->
    <div class="card">
      <div class="card-head"><div class="card-title"><span class="icon">⌁</span>Data</div></div>
      <div class="data-actions">
        <button class="ghost-btn" id="exportBtn">↓ Export data (JSON)</button>
        <button class="ghost-btn" id="importBtn">↑ Import data</button>
        <input type="file" id="importFile" accept="application/json">
      </div>
    </div>
  </section>

  <!-- ============ HISTORY ============ -->
  <section class="view" id="view-history">
    <div class="hist-section">
      <div class="hist-title">Daily history</div>
      <div id="dayHistoryWrap"></div>
    </div>
    <div class="hist-section">
      <div class="hist-title">Weekly history</div>
      <div id="weekHistoryWrap"></div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==========================================================
   SERENE // LIFE CONTROL PANEL — v1
   Single-file app. Data lives in localStorage under STORAGE_KEY.
   Structured so the `state` object could later be swapped for
   reads/writes against a real database with minimal changes —
   all mutations go through saveState(), and all reads go
   through loadState().
   ========================================================== */

const STORAGE_KEY = 'serene-lcp-v1';

const DAILY_TEMPLATE = [
  'Check urgent WhatsApp / Telegram / email',
  'Check outstanding documents',
  'Check underwriting / submissions',
  'Check pending client servicing',
  'Follow up clients / prospects',
  "Check today's appointments",
  '15-minute skill practice',
  "Choose today's 3 main quests"
];

const STAT_DEFS = [
  { key: 'appointments', label: 'Appointments' },
  { key: 'prospects',    label: 'New Prospects' },
  { key: 'followups',    label: 'Follow-ups' },
  { key: 'casesSubmitted', label: 'Cases Submitted' },
  { key: 'casesClosed',  label: 'Cases Closed' },
  { key: 'fycc',         label: 'FYCC Earned', isMoney: true },
  { key: 'exercise',     label: 'Exercise Sessions' }
];

function pad(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseDate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function mondayOf(d){
  const date = new Date(d);
  const day = date.getDay(); // 0 = Sun
  const diff = (day === 0 ? -6 : 1) - day;
  date.setDate(date.getDate() + diff);
  return fmtDate(date);
}
function emptyStats(){
  const o = {};
  STAT_DEFS.forEach(s => o[s.key] = 0);
  return o;
}
function defaultTargets(){
  return { appointments:8, prospects:5, followups:10, casesSubmitted:3, casesClosed:2, fycc:2000, exercise:3 };
}

function defaultState(){
  const today = fmtDate(new Date());
  return {
    version: 1,
    goal: { currentFYCC: 0, targetFYCC: 50000 },
    weeklyTargets: defaultTargets(),
    currentWeek: { weekStart: mondayOf(new Date()), stats: emptyStats() },
    weekHistory: [],
    today: {
      date: today,
      checklist: DAILY_TEMPLATE.map(() => false),
      quests: [ {text:'', done:false}, {text:'', done:false}, {text:'', done:false} ],
      energy: null
    },
    dayHistory: []
  };
}

function loadState(){
  let raw;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch(e) { raw = null; }
  if(!raw) return defaultState();
  try{
    const parsed = JSON.parse(raw);
    // shallow-merge with defaults to survive future field additions
    const base = defaultState();
    return {
      ...base, ...parsed,
      goal: { ...base.goal, ...(parsed.goal||{}) },
      weeklyTargets: { ...base.weeklyTargets, ...(parsed.weeklyTargets||{}) },
      currentWeek: { ...base.currentWeek, ...(parsed.currentWeek||{}), stats: { ...base.currentWeek.stats, ...((parsed.currentWeek||{}).stats||{}) } },
      today: { ...base.today, ...(parsed.today||{}) },
      weekHistory: parsed.weekHistory || [],
      dayHistory: parsed.dayHistory || []
    };
  }catch(e){
    console.error('Failed to parse stored state, starting fresh.', e);
    return defaultState();
  }
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Save failed', e);
    showToast('Could not save — storage may be full');
  }
}

let state = loadState();

/* ---------- Daily / Weekly reset ---------- */
function checkDailyReset(){
  const todayStr = fmtDate(new Date());
  if(state.today.date !== todayStr){
    // archive the day that just ended, but only if it had any activity
    const t = state.today;
    const checklistDone = t.checklist.filter(Boolean).length;
    const questsDone = t.quests.filter(q => q.done && q.text.trim()).length;
    const hadActivity = checklistDone > 0 || questsDone > 0 || t.energy || t.quests.some(q => q.text.trim());
    if(hadActivity){
      state.dayHistory.unshift({
        date: t.date,
        checklistDone, checklistTotal: DAILY_TEMPLATE.length,
        questsDone, questsTotal: 3,
        energy: t.energy
      });
    }
    state.today = {
      date: todayStr,
      checklist: DAILY_TEMPLATE.map(() => false),
      quests: [ {text:'', done:false}, {text:'', done:false}, {text:'', done:false} ],
      energy: null
    };
    saveState();
  }
}

function checkWeeklyReset(){
  const thisMonday = mondayOf(new Date());
  if(state.currentWeek.weekStart !== thisMonday){
    const w = state.currentWeek;
    const hadActivity = Object.values(w.stats).some(v => v > 0);
    if(hadActivity){
      const start = parseDate(w.weekStart);
      const end = new Date(start); end.setDate(end.getDate() + 6);
      state.weekHistory.unshift({
        weekStart: w.weekStart,
        weekEnd: fmtDate(end),
        stats: w.stats,
        targets: { ...state.weeklyTargets }
      });
    }
    state.currentWeek = { weekStart: thisMonday, stats: emptyStats() };
    saveState();
  }
}

checkDailyReset();
checkWeeklyReset();

/* ---------- Toast ---------- */
let toastTimer;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

/* ---------- Tabs ---------- */
document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const view = btn.dataset.view;
    document.querySelectorAll('section.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + view).classList.add('active');
    if(view === 'history') renderHistory();
  });
});

/* ---------- Header label ---------- */
function renderHeader(){
  const d = new Date();
  const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
  document.getElementById('todayLabel').textContent = d.toLocaleDateString('en-SG', opts);
}

/* ---------- IDA Goal ---------- */
function renderGoal(){
  const { currentFYCC, targetFYCC } = state.goal;
  const pct = targetFYCC > 0 ? Math.min(100, Math.round((currentFYCC / targetFYCC) * 100)) : 0;
  document.getElementById('goalCurrent').textContent = '$' + currentFYCC.toLocaleString('en-SG');
  document.getElementById('goalTarget').textContent = '$' + targetFYCC.toLocaleString('en-SG');
  document.getElementById('goalPct').textContent = pct + '%';
  document.getElementById('goalBar').style.width = pct + '%';
}

document.getElementById('goalEditToggle').addEventListener('click', () => {
  const row = document.getElementById('goalEditRow');
  const showing = row.style.display !== 'none';
  row.style.display = showing ? 'none' : 'flex';
  if(!showing){
    document.getElementById('goalCurrentInput').value = state.goal.currentFYCC;
    document.getElementById('goalTargetInput').value = state.goal.targetFYCC;
  }
});
document.getElementById('goalSaveBtn').addEventListener('click', () => {
  const cur = Number(document.getElementById('goalCurrentInput').value) || 0;
  const tgt = Number(document.getElementById('goalTargetInput').value) || 0;
  state.goal.currentFYCC = Math.max(0, cur);
  state.goal.targetFYCC = Math.max(0, tgt);
  saveState();
  renderGoal();
  document.getElementById('goalEditRow').style.display = 'none';
  showToast('Goal updated');
});

/* ---------- Quests ---------- */
function renderQuests(){
  const wrap = document.getElementById('questsList');
  wrap.innerHTML = '';
  const labels = ['Main Quest', 'Quest 2', 'Quest 3'];
  state.today.quests.forEach((q, i) => {
    const row = document.createElement('div');
    row.className = 'quest' + (i === 0 ? ' main' : '') + (q.done ? ' done' : '');

    const tag = document.createElement('div');
    tag.className = 'quest-tag';
    tag.textContent = labels[i];

    const check = document.createElement('div');
    check.className = 'quest-check' + (q.done ? ' done' : '');
    check.innerHTML = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4" stroke="#10121a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    check.addEventListener('click', () => {
      state.today.quests[i].done = !state.today.quests[i].done;
      saveState();
      renderQuests();
    });

    const input = document.createElement('input');
    input.className = 'quest-input';
    input.type = 'text';
    input.placeholder = i === 0 ? "Today's single most important outcome…" : 'Optional…';
    input.value = q.text;
    input.addEventListener('input', () => {
      state.today.quests[i].text = input.value;
      saveState();
    });

    row.appendChild(tag);
    row.appendChild(check);
    row.appendChild(input);
    wrap.appendChild(row);
  });
}

/* ---------- Dailies ---------- */
function renderDailies(){
  const wrap = document.getElementById('dailyList');
  wrap.innerHTML = '';
  DAILY_TEMPLATE.forEach((text, i) => {
    const done = !!state.today.checklist[i];
    const row = document.createElement('div');
    row.className = 'daily-item' + (done ? ' done' : '');

    const check = document.createElement('div');
    check.className = 'daily-check' + (done ? ' done' : '');
    check.innerHTML = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.5 12L13 4" stroke="#10121a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    const label = document.createElement('div');
    label.className = 'daily-text';
    label.textContent = text;

    const toggle = () => {
      state.today.checklist[i] = !state.today.checklist[i];
      saveState();
      renderDailies();
    };
    check.addEventListener('click', toggle);
    label.addEventListener('click', toggle);

    row.appendChild(check);
    row.appendChild(label);
    wrap.appendChild(row);
  });

  const doneCount = state.today.checklist.filter(Boolean).length;
  const total = DAILY_TEMPLATE.length;
  document.getElementById('dailyCount').textContent = `${doneCount} / ${total}`;
  document.getElementById('dailyBar').style.width = (total ? (doneCount/total*100) : 0) + '%';
}

/* ---------- Weekly Stats ---------- */
let weekEditMode = false;

function renderStats(){
  const grid = document.getElementById('statGrid');
  grid.innerHTML = '';
  STAT_DEFS.forEach(def => {
    const current = state.currentWeek.stats[def.key] || 0;
    const target = state.weeklyTargets[def.key] || 0;
    const pct = target > 0 ? Math.min(100, Math.round((current/target)*100)) : 0;

    const card = document.createElement('div');
    card.className = 'stat-card';

    const name = document.createElement('div');
    name.className = 'stat-name';
    name.textContent = def.label;

    const nums = document.createElement('div');
    nums.className = 'stat-nums';
    const cur = document.createElement('span');
    cur.className = 'stat-current';
    cur.textContent = def.isMoney ? '$' + current.toLocaleString('en-SG') : current;
    const slash = document.createElement('span');
    slash.className = 'goal-slash';
    slash.textContent = ' / ';
    const tgt = document.createElement('span');
    tgt.className = 'stat-target';
    tgt.textContent = def.isMoney ? '$' + target.toLocaleString('en-SG') : target;
    nums.appendChild(cur); nums.appendChild(slash); nums.appendChild(tgt);

    const track = document.createElement('div');
    track.className = 'bar-track';
    const fill = document.createElement('div');
    fill.className = 'bar-fill thin';
    fill.style.width = pct + '%';
    fill.style.background = 'var(--teal)';
    fill.style.boxShadow = 'none';
    track.appendChild(fill);

    card.appendChild(name);
    card.appendChild(nums);
    card.appendChild(track);

    if(weekEditMode){
      const controls = document.createElement('div');
      controls.className = 'stat-controls';

      const minus = document.createElement('button');
      minus.className = 'stepper'; minus.textContent = '−';
      minus.addEventListener('click', () => {
        state.currentWeek.stats[def.key] = Math.max(0, current - (def.isMoney ? 100 : 1));
        saveState(); renderStats();
      });

      const plus = document.createElement('button');
      plus.className = 'stepper'; plus.textContent = '+';
      plus.addEventListener('click', () => {
        state.currentWeek.stats[def.key] = current + (def.isMoney ? 100 : 1);
        saveState(); renderStats();
      });

      const targetInput = document.createElement('input');
      targetInput.type = 'number';
      targetInput.min = '0';
      targetInput.value = target;
      targetInput.style.cssText = 'width:64px;background:var(--card);border:1px solid var(--card-border);color:var(--ink);border-radius:6px;padding:4px 6px;font-family:var(--font-mono);font-size:12px;';
      targetInput.addEventListener('change', () => {
        state.weeklyTargets[def.key] = Math.max(0, Number(targetInput.value) || 0);
        saveState(); renderStats();
      });
      const targetLabel = document.createElement('span');
      targetLabel.style.cssText = 'font-size:10px;color:var(--ink-faint);font-family:var(--font-mono);align-self:center;';
      targetLabel.textContent = 'target';

      controls.appendChild(minus);
      controls.appendChild(plus);
      controls.appendChild(targetLabel);
      controls.appendChild(targetInput);
      card.appendChild(controls);
    }

    grid.appendChild(card);
  });
}

document.getElementById('weekEditToggle').addEventListener('click', () => {
  weekEditMode = !weekEditMode;
  renderStats();
});

/* ---------- Energy ---------- */
function renderEnergy(){
  document.querySelectorAll('.energy-btn').forEach(btn => {
    const val = btn.dataset.energy;
    btn.classList.remove('sel-low','sel-okay','sel-good');
    if(state.today.energy === val) btn.classList.add('sel-' + val);
  });
}
document.querySelectorAll('.energy-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.today.energy = state.today.energy === btn.dataset.energy ? null : btn.dataset.energy;
    saveState();
    renderEnergy();
  });
});

/* ---------- History ---------- */
function renderHistory(){
  const dayWrap = document.getElementById('dayHistoryWrap');
  if(state.dayHistory.length === 0){
    dayWrap.innerHTML = '<div class="empty-note">No days logged yet — history fills in once a day ends.</div>';
  } else {
    let rows = state.dayHistory.slice(0, 60).map(d => `
      <tr>
        <td>${d.date}</td>
        <td>${d.checklistDone} / ${d.checklistTotal}</td>
        <td>${d.questsDone} / ${d.questsTotal}</td>
        <td>${d.energy ? `<span class="pill ${d.energy}">${d.energy}</span>` : '—'}</td>
      </tr>`).join('');
    dayWrap.innerHTML = `<table class="hist-table">
      <thead><tr><th>Date</th><th>Dailies</th><th>Quests</th><th>Energy</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }

  const weekWrap = document.getElementById('weekHistoryWrap');
  if(state.weekHistory.length === 0){
    weekWrap.innerHTML = '<div class="empty-note">No weeks logged yet — history fills in every Monday.</div>';
  } else {
    let rows = state.weekHistory.slice(0, 52).map(w => `
      <tr>
        <td>${w.weekStart} – ${w.weekEnd}</td>
        <td>${w.stats.appointments}/${w.targets.appointments}</td>
        <td>${w.stats.casesClosed}/${w.targets.casesClosed}</td>
        <td>$${(w.stats.fycc||0).toLocaleString('en-SG')}</td>
        <td>${w.stats.exercise}</td>
      </tr>`).join('');
    weekWrap.innerHTML = `<table class="hist-table">
      <thead><tr><th>Week</th><th>Appts</th><th>Closed</th><th>FYCC</th><th>Exercise</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }
}

/* ---------- Export / Import ---------- */
document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `serene-lcp-backup-${fmtDate(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Data exported');
});

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || typeof parsed !== 'object' || !parsed.goal || !parsed.today){
        throw new Error('File does not look like a valid backup');
      }
      state = parsed;
      saveState();
      checkDailyReset();
      checkWeeklyReset();
      renderAll();
      showToast('Data imported');
    }catch(err){
      console.error(err);
      showToast('Import failed — invalid file');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

/* ---------- Render all ---------- */
function renderAll(){
  renderHeader();
  renderGoal();
  renderQuests();
  renderDailies();
  renderStats();
  renderEnergy();
  if(document.getElementById('view-history').classList.contains('active')) renderHistory();
}

renderAll();

// Catch the case where the tab is left open across midnight / a Monday rollover.
setInterval(() => {
  const beforeDay = state.today.date;
  const beforeWeek = state.currentWeek.weekStart;
  checkDailyReset();
  checkWeeklyReset();
  if(state.today.date !== beforeDay || state.currentWeek.weekStart !== beforeWeek){
    renderAll();
  }
}, 60 * 1000);
</script>
</body>
</html>
