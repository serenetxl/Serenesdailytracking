name: 定联 reminders

on:
  workflow_dispatch:        # started by cron-job.org (11:00 and 17:00 SGT), or by you pressing "Run workflow"
    inputs:
      mode:
        description: "morning or evening"
        default: "morning"

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Send reminder
        env:
          FIREBASE_PASSWORD: ${{ secrets.FIREBASE_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ "$MODE" != "evening" ]; then MODE=morning; fi
          node reminder.mjs $MODE
