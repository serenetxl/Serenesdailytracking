name: News digest

on:
  workflow_dispatch:         # started by cron-job.org (morning and evening), or by pressing "Run workflow"
    inputs:
      mode:
        description: "morning or evening"
        required: false
        default: "morning"

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Send news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_MODE: ${{ github.event.inputs.mode }}
        run: node news.mjs
